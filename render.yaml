# Render Blueprint for the Maqast barber-booking API.
#
# Deploy: Render dashboard → New → Blueprint → connect this repo. Render reads
# this file, creates the web service + Postgres, and prompts for every env var
# marked `sync: false`.
#
# Notes
# - `npm start` runs `prisma migrate deploy` before boot, so migrations apply
#   on every deploy (including the btree_gist exclusion constraint — Render
#   Postgres allows trusted extensions).
# - Health checks hit /api/health/ready (verifies the DB), so a deploy only
#   goes live once it can actually serve traffic.
# - Plans: `starter` web + paid Postgres are the smallest tiers that DON'T
#   sleep/expire. Render's free web tier spins down after ~15 min idle
#   (30-60s cold starts — worse than the Railway cold starts you saw), and
#   free Postgres is suspended after 30 days. Downgrade only for throwaway
#   staging.

services:
  - type: web
    name: brb-backend
    runtime: node
    region: frankfurt # closest Render region to Iraq
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeploy: true # deploy on every push to the default branch
    envVars:
      - key: NODE_ENV
        value: production
      # The server refuses to boot in production without a real secret;
      # Render generates a strong random value at create time.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brb-postgres
          property: connectionString
      # Comma-separated origins allowed to call the API (deployed admin panel).
      # Prompted for in the dashboard on first deploy.
      - key: CORS_ORIGINS
        sync: false
      # console = OTP codes print to logs (staging). Set to `twilio` + the
      # TWILIO_* vars below for real SMS.
      - key: SMS_PROVIDER
        value: console
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Whole Firebase service-account JSON as one value (see DEPLOYMENT.md).
      # Leave empty to run without push — the API no-ops FCM when unset.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_ACCESS_TOKEN_TTL
        value: 8h
      - key: LOG_LEVEL
        value: info

databases:
  - name: brb-postgres
    region: frankfurt # keep the DB in the same region as the API
    plan: basic-256mb # smallest non-expiring tier; free DBs suspend after 30 days
    postgresMajorVersion: "16"
